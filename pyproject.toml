[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-agents"
version = "0.1.0"
description = "Aether Applied multi-agent opportunity pipeline with Notion as command center"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Aether Applied" }]
dependencies = [
  "httpx>=0.27.2,<0.29",
  "pydantic>=2.9.0,<3",
  "pydantic-settings>=2.5.0,<3",
  "python-dotenv>=1.0.1,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0,<2",
  "pytest>=8.3.0,<9",
  "pytest-cov>=5.0.0,<7",
  "ruff>=0.6.0,<0.9",
  "types-requests>=2.32.0",
]

[project.scripts]
aether = "aether_agents.chat:main"
aether-agents = "aether_agents.runner:main"
aether-chat = "aether_agents.chat:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["aether_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["aether_agents"]
omit = [
  "*/integrations/llm.py",
  "*/runner.py",
  "*/eval_runner.py",
  "*/chat.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
